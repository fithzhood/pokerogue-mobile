<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: a schermo intero il gioco arriva fino ai bordi -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- Cache-proof: il telefono non deve mai restare su una versione vecchia -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="theme-color" content="#05060a">
  <title>PokeRogue Mobile</title>

  <!-- ==========================================================================
       Questa pagina e' solo il GUSCIO. Il gioco vero (struttura, stile e motore)
       lo carica `pokerogue-boot.js`, che sceglie fra i file dentro l'APK e la
       versione piu' recente scaricata dal sito — vedi §28 di HANDOFF.md.
       Qui dentro deve restare il minimo indispensabile, perche' e' l'unico
       pezzo che per cambiare richiede di rifare l'APK.
       ====================================================================== -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; background: #05060a; color: #f4f6fb;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    #pr-boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    #pr-boot .pr-ball {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(#6b6a9c 0 48%, #10131a 48% 52%, #8a8f92 52%);
      box-shadow: 0 0 0 3px #10131a inset, 0 6px 18px rgba(0,0,0,.5);
      animation: prSpin 1.4s ease-in-out infinite;
      margin: 0 auto 14px;
    }
    #pr-boot .pr-msg { font-size: 15px; opacity: .85; line-height: 1.5; }
    @keyframes prSpin {
      0%, 100% { transform: rotate(-12deg) scale(1); }
      50%      { transform: rotate(12deg) scale(1.06); }
    }
  </style>
</head>
<body>

  <div id="pr-boot">
    <div>
      <div class="pr-ball"></div>
      <div class="pr-msg">Caricamento…</div>
    </div>
  </div>

  <script src="pokerogue-boot.js?v=1"></script>
</body>
</html>
